services:
  pipeline:
    build: .
    env_file: .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./cookies.txt:/cookies/cookies.txt:ro
      - ./saved_videos:/app/saved_videos
      - ./.env:/app/.env
      - ./prompts:/app/prompts:ro

  viewer:
    build: ./viewer
    ports:
      - "8000:8000"
    environment:
      - PIPELINE_URL=http://pipeline:8001
    volumes:
      - ./saved_videos:/app/saved_videos:ro
      - ./.env:/app/.env
    depends_on:
      - pipeline
